services:
  - type: web
    name: n8n
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    disk:
      name: n8n-data
      mountPath: /data
      sizeGB: 10
    envVars:
      # --- Existing Render-specific keys ---
      - key: N8N_HOST
        value: n8n-ffmpeg-deploy-tkgq.onrender.com
      - key: N8N_PROTOCOL
        value: https
      - key: WEBHOOK_URL
        value: https://n8n-ffmpeg-deploy-tkgq.onrender.com/
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      - key: N8N_RUNNERS_ENABLED
        value: "true"
      - key: N8N_BLOCK_ENV_ACCESS_IN_NODE
        value: "false"

      # --- This is the fix you asked for ---
      - key: N8N_PM_PACKAGES
        value: katex
      # --------------------------------------

      # --- This is your memory fix, now correctly placed ---
      - key: NODE_OPTIONS
        value: "--max-old-space-size=1536"
      # ---------------------------------------------------

    autoDeploy: true
