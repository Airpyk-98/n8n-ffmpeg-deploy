services:
  - type: web
    name: n8n
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    disk:
      name: n8n-data
      mountPath: /data
      sizeGB: 10
    envVars:
      # --- Existing Render-specific keys ---
      - key: N8N_HOST
        value: n8n-ffmpeg-deploy-tkgq.onrender.com
      - key: N8N_PROTOCOL
        value: https
      - key: WEBHOOK_URL
        value: https://n8n-ffmpeg-deploy-tkgq.onrender.com/
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      - key: N8N_RUNNERS_ENABLED
        value: "true"
      - key: N8N_BLOCK_ENV_ACCESS_IN_NODE
        value: "false"

      # --- Your memory fix ---
      - key: NODE_OPTIONS
        value: "--max-old-space-size=1536"

      # --- KICK 1: Install KaTeX ---
      - key: N8N_PM_PACKAGES
        value: katex

      # --- FIX 2: Allow KaTeX in Code Node ---
      - key: N8N_MODULES_ALLOWLIST
        value: katex

      # --- FIX 3: Fix the 'trust proxy' ValidationError ---
      - key: N8N_EXPRESS_TRUST_PROXY
        value: "true"

    autoDeploy: true
